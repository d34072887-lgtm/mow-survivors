<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f7ebe0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>割草游戏 · 小葵出发</title>
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <div id="app">

    <!-- ── 主界面：看谁、听一句、点出发（docs/26 §5.1） ── -->
    <section class="screen screen-home" id="screenHome">
      <header class="top-bar">
        <div class="player-line"><b>Lv.12</b> · 旅人</div>
        <div class="top-right">
          <button class="top-icon" type="button" data-toast="今日邮件：3 条未读" aria-label="邮件">✉️<span class="badge">3</span></button>
          <button class="top-icon" type="button" data-toast="任务：再抓 1 只宠物（0/1）" aria-label="任务">📋</button>
          <div class="currencies" aria-label="资源">
            <div><span>🪙</span><em id="homeGold">2,480</em></div>
            <div><span>🍀</span>115</div>
          </div>
        </div>
      </header>

      <main class="hero-stage">
        <div class="hero-art" aria-hidden="true"></div>
        <div class="quote-caption">
          <div class="who">小葵 · 驯兽师</div>
          <p id="quoteText">今天的幸运值不错……要不要一起去抓一只圆滚滚的伙伴？</p>
        </div>
        <div class="bottom-stack">
          <button class="status-pill" type="button" id="openSheet" aria-expanded="false">
            <div>
              <div class="label" id="pillLabel">3 只伙伴 · 今日试手气可领</div>
              <div class="hint">羁绊 3/6 · 点按查看</div>
            </div>
            <span class="chev" aria-hidden="true">›</span>
          </button>
          <div class="hero-dots" id="heroDots" aria-label="切换英雄">
            <button class="dot on" type="button" aria-label="小葵"></button>
            <button class="dot" type="button" aria-label="老金"></button>
            <button class="dot" type="button" aria-label="零"></button>
          </div>
        </div>
      </main>

      <div class="cta-zone">
        <button class="btn-start" type="button" id="btnStart">出 发</button>
      </div>

      <nav class="bottom-nav" aria-label="主导航">
        <button class="nav-item on" type="button"><span class="ni">🏠</span>首页</button>
        <button class="nav-item" type="button" data-toast="英雄：小葵已解锁，老金 / 零 下个版本"><span class="ni">💫</span>英雄</button>
        <button class="nav-item" type="button" id="navBattle"><span class="ni">⚔️</span>战斗</button>
        <button class="nav-item" type="button" data-toast="收藏：图鉴已收集 12 / 48"><span class="ni">📖</span>收藏</button>
        <button class="nav-item" type="button" data-toast="更多：商店 · 设置 · 任务"><span class="ni">⋯</span>更多</button>
      </nav>
    </section>

    <!-- ── 局内：上战场 / 下拇指区（docs/26 §2、§5） ── -->
    <section class="screen screen-battle" id="screenBattle" hidden>
      <div class="battle-wrap" id="battleWrap">
        <canvas id="battle"></canvas>

        <div class="hud" id="hud">
          <div class="hud-row">
            <div class="hp-track" aria-label="生命"><div class="hp-fill" id="hpFill"></div></div>
            <div class="hud-pill timer" id="timer">15</div>
            <button class="hud-btn" type="button" id="btnPause" aria-label="暂停">❚❚</button>
          </div>
          <div class="hud-row">
            <div class="hud-pill">🪙 <span id="gold">0</span></div>
            <div class="hud-pill">🐾 <span id="pets">0</span></div>
            <div class="hud-pill soft">✕ <span id="kills">0</span></div>
            <div class="round-tag" id="roundTag">第 1 回合</div>
          </div>
          <div class="boss-bar" id="bossBar" hidden>
            <div class="boss-name" id="bossName">史莱姆王</div>
            <div class="boss-track"><div class="boss-fill" id="bossFill"></div></div>
          </div>
        </div>

        <div class="banner" id="banner" aria-live="polite"></div>
        <div class="load-msg" id="loadMsg">加载中…</div>
      </div>

      <div class="controls" id="controls">
        <div class="joy-zone" id="joyZone" aria-label="摇杆区">
          <div class="joystick" id="joystick">
            <div class="joy-base"></div>
            <div class="joy-stick" id="joyStick"></div>
          </div>
          <div class="control-hint" id="controlHint">按住任意处推动摇杆<br />小葵会自己出手</div>
        </div>
        <button class="btn-skill" type="button" id="btnSkill" aria-label="诱捕标记">
          <svg class="cd-ring" viewBox="0 0 36 36" aria-hidden="true"><circle id="cdArc" cx="18" cy="18" r="16" /></svg>
          <span class="skill-icon">🎯</span>
        </button>
      </div>
    </section>
  </div>

  <!-- ── 回合间：4 选 1（docs/09） ── -->
  <div class="overlay" id="pickOverlay">
    <div class="pick-card">
      <div class="pick-head">
        <h2 id="pickTitle">第 1 回合 · 选一样带走</h2>
        <p id="pickSub">🪙 <span id="pickGold">0</span></p>
      </div>
      <div class="pick-grid" id="pickGrid"></div>
      <button class="btn-refresh" type="button" id="btnRefresh">🍀 刷新看看 · 5 🪙</button>
    </div>
  </div>

  <!-- ── 暂停 / 结算 ── -->
  <div class="overlay" id="menuOverlay">
    <div class="overlay-card">
      <h2 id="menuTitle">暂停</h2>
      <p id="menuBody"></p>
      <div class="pet-shelf" id="petShelf" hidden></div>
      <button type="button" id="btnPrimary">继续</button>
      <button type="button" class="secondary" id="btnSecondary">返回主界面</button>
    </div>
  </div>

  <!-- ── 主界面详情 sheet ── -->
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-hidden="true">
    <div class="sheet-handle"></div>
    <h2>今日</h2>
    <div class="sheet-row">
      <div>
        <div>宠物羁绊</div>
        <div class="pet-row" id="homePetRow"></div>
      </div>
      <span class="muted" id="homePetCount">3 / 6</span>
    </div>
    <div class="sheet-row">
      <span>今日试手气 · 商店刷新 -20%</span>
      <button type="button" id="claimLuck">领取</button>
    </div>
    <div class="sheet-row">
      <span>任务 · 再抓 1 只宠物</span>
      <button type="button" data-toast="任务详情开发中">查看</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="src/main.js"></script>
  <noscript>需要开启 JavaScript。</noscript>
</body>
</html>
